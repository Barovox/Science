services:

  # ══════════════════════════════════════════════════════════════
  # 🗄️  SQL SERVER 2019 - Database
  # ══════════════════════════════════════════════════════════════
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: uef-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      # Dữ liệu SQL Server được lưu persistent
      - sqlserver_data:/var/opt/mssql
      # Script khởi tạo database (chạy lần đầu)
      - ./docker/sqlserver/init:/docker-entrypoint-initdb.d:ro
    networks:
      - khcn-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '${MSSQL_SA_PASSWORD}' -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ══════════════════════════════════════════════════════════════
  # ⚙️  QLKHCN API - ASP.NET Core 5.0
  # ══════════════════════════════════════════════════════════════
  qlkhcn-api:
    build:
      context: ./src/apikhcn
      dockerfile: Dockerfile
    container_name: uef-qlkhcn-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-27777}:80"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__MyDB: "Server=sqlserver,1433;Database=${DB_NAME:-QLKHCN_Data_Api_9_UEF};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;"
      JWT__ValidAudience: "${JWT_VALID_AUDIENCE:-http://localhost:27777/}"
      JWT__ValidIssuer: "${JWT_VALID_ISSUER:-http://localhost:27777/}"
      JWT__Secret: "${JWT_SECRET}"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - khcn-network
    volumes:
      # Mount thư mục Template nếu có file template Word/Excel
      - ./src/apikhcn/QLKHCN_API/Template:/app/Template:ro

  # ══════════════════════════════════════════════════════════════
  # 🌐  KHCN FRONTEND - React + Nginx
  # ══════════════════════════════════════════════════════════════
  khcn-frontend:
    build:
      context: ./src/khcn/khcn.uef.edu.vn
      dockerfile: Dockerfile
    container_name: uef-khcn-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - khcn-network
    depends_on:
      - qlkhcn-api

  # ══════════════════════════════════════════════════════════════
  # 📧  MAILER API - Node.js / Express
  # ══════════════════════════════════════════════════════════════
  mailer-api:
    build:
      context: ./src/khcn/mailer-api
      dockerfile: Dockerfile
    container_name: uef-mailer-api
    restart: unless-stopped
    ports:
      - "${MAILER_PORT:-5174}:5174"
    environment:
      PORT: "5174"
      NODE_ENV: "production"
    networks:
      - khcn-network

  # ══════════════════════════════════════════════════════════════
  # 📁  ASSETS API - Node.js / File Upload & Certificate
  # ══════════════════════════════════════════════════════════════
  assetskhcn-api:
    build:
      context: ./src/khcn/assetskhcn-api
      dockerfile: Dockerfile
    container_name: uef-assets-api
    restart: unless-stopped
    ports:
      - "${ASSETS_PORT:-5175}:5174"
    environment:
      PORT: "5174"
      NODE_ENV: "production"
    volumes:
      # Mount các thư mục upload để dữ liệu không bị mất khi restart
      - assets_uploads:/app/uploads
      - assets_avatars:/app/avatars
      - assets_certificates:/app/certificates
    networks:
      - khcn-network

# ══════════════════════════════════════════════════════════════
# 📦  VOLUMES - Lưu trữ dữ liệu persistent
# ══════════════════════════════════════════════════════════════
volumes:
  sqlserver_data:
    driver: local
  assets_uploads:
    driver: local
  assets_avatars:
    driver: local
  assets_certificates:
    driver: local

# ══════════════════════════════════════════════════════════════
# 🔗  NETWORKS
# ══════════════════════════════════════════════════════════════
networks:
  khcn-network:
    driver: bridge
